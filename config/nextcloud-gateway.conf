# Local ingress only; no Nextcloud application or user-data mounts.
ServerName localhost
<VirtualHost *:80>
    ProxyRequests Off
    ProxyPreserveHost On
    AllowEncodedSlashes NoDecode
    LimitRequestBody 0
    Timeout 14400
    ProxyTimeout 14400
    ProxyPass / http://nextcloud/ nocanon
    ProxyPassReverse / http://nextcloud/
    ErrorLog /proc/self/fd/2
    CustomLog /dev/null common
</VirtualHost>
