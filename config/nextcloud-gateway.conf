ServerName localhost
<VirtualHost *:80>
    Protocols h2c http/1.1
    H2Direct On
    H2Upgrade On
    H2MaxSessionStreams 64
    KeepAlive On
    MaxKeepAliveRequests 10000
    ProxyRequests Off
    ProxyPreserveHost On
    AllowEncodedSlashes NoDecode
    LimitRequestBody 0
    Timeout 14400
    ProxyTimeout 14400
    ProxyPass / http://nextcloud/ nocanon disablereuse=On
    ProxyPassReverse / http://nextcloud/
    ErrorLog /proc/self/fd/2
    CustomLog /dev/null common
</VirtualHost>
