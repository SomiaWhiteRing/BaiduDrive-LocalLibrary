x-service-defaults: &service-defaults
  pull_policy: never
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "3"}
x-nextcloud-image: &nextcloud-image nextcloud@sha256:0e5688ba0988b9112cf03f9c6bab53eccb466d278435f6596f16c1f25acacf74

name: ${COMPOSE_PROJECT_NAME:-baidudrive-local}
services:
  openlist:
    <<: *service-defaults
    container_name: ${COMPOSE_PROJECT_NAME:-baidudrive-local}-openlist
    image: openlistteam/openlist@sha256:c555c6e1c8af2aead38ed12ec761ac077fdf046d19cf033414be8e056aec6b64
    user: "0:0"
    ports:
      - "127.0.0.1:${OPENLIST_PORT:-5244}:5244"
    volumes:
      - ${DATA_DIR:?Set DATA_DIR in .env}/openlist:/opt/openlist/data
    environment:
      TZ: ${TZ:-UTC}
      UMASK: "077"
    mem_limit: 2g
    memswap_limit: 4g
    cpus: 2.0
  empty-codec:
    <<: *service-defaults
    container_name: ${COMPOSE_PROJECT_NAME:-baidudrive-local}-empty-codec
    build: ./codec
    image: ${COMPOSE_PROJECT_NAME:-baidudrive-local}-codec:0.1.0
    networks: [default, nextcloud-internal]
    stop_signal: SIGINT
    depends_on:
      openlist: {condition: service_started}
    ports:
      - "127.0.0.1:${CODEC_PORT:-5246}:8080"
    volumes:
      - ${DATA_DIR:?Set DATA_DIR in .env}/empty-codec:/state
    environment:
      UPSTREAM: http://openlist:5244
      WEBDAV_USER: ${OPENLIST_USER:-library-storage}
      OPENLIST_DAV_PATH: ${OPENLIST_DAV_PATH:-/dav/baidu}
      BAIDUDRIVE_PCS_DOWNLOAD: ${PCS_DOWNLOAD_MODE:-fallback}
      SHARED_METADATA: ${SHARED_METADATA:-1}
      METADATA_DAV_PATH: ${METADATA_DAV_PATH:-${OPENLIST_DAV_PATH:-/dav/baidu}}
      STATE_DIR: /state
      TZ: ${TZ:-UTC}
    read_only: true
    tmpfs: [/tmp:size=32m]
    mem_limit: 1g
    cpus: 4.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
  database:
    <<: *service-defaults
    container_name: ${COMPOSE_PROJECT_NAME:-baidudrive-local}-database
    image: mariadb@sha256:1292844148b311e4ed4300022a996d39083f415a963e970cf47cad1b3b18e3a6
    networks: [nextcloud-internal]
    stop_grace_period: 60s
    command: ["--transaction-isolation=READ-COMMITTED", "--binlog-format=ROW", "--innodb-buffer-pool-size=512M", "--max-connections=64"]
    volumes:
      - ${DATA_DIR:?Set DATA_DIR in .env}/database:/var/lib/mysql
    environment:
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD_FILE: /run/secrets/database_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/database_root_password
      TZ: ${TZ:-UTC}
    secrets: [database_password, database_root_password]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    mem_limit: 1536m
    cpus: 2.0
  redis:
    <<: *service-defaults
    container_name: ${COMPOSE_PROJECT_NAME:-baidudrive-local}-redis
    image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    networks: [nextcloud-internal]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 128m
    cpus: 0.25
  nextcloud:
    <<: *service-defaults
    container_name: ${COMPOSE_PROJECT_NAME:-baidudrive-local}-nextcloud
    image: *nextcloud-image
    networks: [nextcloud-internal]
    depends_on:
      database: {condition: service_healthy}
      redis: {condition: service_started}
      openlist: {condition: service_started}
      empty-codec: {condition: service_healthy}
    volumes:
      - nextcloud-code:/var/www/html
      - ${DATA_DIR:?Set DATA_DIR in .env}/nextcloud/config:/var/www/html/config
      - ${DATA_DIR:?Set DATA_DIR in .env}/nextcloud/data:/var/www/html/data
      - ${DATA_DIR:?Set DATA_DIR in .env}/nextcloud/custom_apps:/var/www/html/custom_apps
      - ./config/mpm_prefork.conf:/etc/apache2/mods-available/mpm_prefork.conf:ro
      - ./config/php-local.ini:/usr/local/etc/php/conf.d/zz-baidudrive.ini:ro
    environment:
      MYSQL_HOST: database
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD_FILE: /run/secrets/database_password
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_USER:-library}
      NEXTCLOUD_ADMIN_PASSWORD_FILE: /run/secrets/nextcloud_admin_password
      NEXTCLOUD_TRUSTED_DOMAINS: "127.0.0.1 localhost"
      REDIS_HOST: redis
      PHP_MEMORY_LIMIT: 512M
      PHP_UPLOAD_LIMIT: 32G
      APACHE_BODY_LIMIT: "0"
      LIBRARY_WEBDAV_USER: ${OPENLIST_USER:-library-storage}
      LIBRARY_WEBDAV_ROOT: ${OPENLIST_DAV_PATH:-/dav/baidu}
      OVERWRITECLIURL: http://127.0.0.1:${SERVER_PORT:-8787}
      TZ: ${TZ:-UTC}
    secrets: [database_password, nextcloud_admin_password]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/status.php"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    mem_limit: 4g
    cpus: 6.0
  cron:
    <<: *service-defaults
    container_name: ${COMPOSE_PROJECT_NAME:-baidudrive-local}-cron
    image: *nextcloud-image
    networks: [nextcloud-internal]
    entrypoint: /cron.sh
    depends_on:
      nextcloud: {condition: service_healthy}
    volumes:
      - nextcloud-code:/var/www/html
      - ${DATA_DIR:?Set DATA_DIR in .env}/nextcloud/config:/var/www/html/config
      - ${DATA_DIR:?Set DATA_DIR in .env}/nextcloud/data:/var/www/html/data
      - ${DATA_DIR:?Set DATA_DIR in .env}/nextcloud/custom_apps:/var/www/html/custom_apps
      - ./config/php-local.ini:/usr/local/etc/php/conf.d/zz-baidudrive.ini:ro
    environment:
      TZ: ${TZ:-UTC}
      LIBRARY_WEBDAV_USER: ${OPENLIST_USER:-library-storage}
      LIBRARY_WEBDAV_ROOT: ${OPENLIST_DAV_PATH:-/dav/baidu}
    mem_limit: 384m
    cpus: 0.5
  nextcloud-gateway:
    <<: *service-defaults
    container_name: ${COMPOSE_PROJECT_NAME:-baidudrive-local}-nextcloud-gateway
    image: *nextcloud-image
    entrypoint: ["/bin/sh", "-c", "a2dismod php mpm_prefork >/dev/null && a2enmod mpm_event http2 proxy proxy_http >/dev/null && exec apache2-foreground"]
    networks: [default, nextcloud-internal]
    depends_on:
      nextcloud: {condition: service_healthy}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8787}:80"
    volumes:
      - ./config/nextcloud-gateway.conf:/etc/apache2/sites-enabled/000-default.conf:ro
      - ./config/mpm_event.conf:/etc/apache2/mods-available/mpm_event.conf:ro
    tmpfs: [/var/www/html:size=1m]
    environment:
      TZ: ${TZ:-UTC}
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/status.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
secrets:
  database_password: {file: "${DATA_DIR:?Set DATA_DIR in .env}/secrets/database-password.txt"}
  database_root_password: {file: "${DATA_DIR:?Set DATA_DIR in .env}/secrets/database-root-password.txt"}
  nextcloud_admin_password: {file: "${DATA_DIR:?Set DATA_DIR in .env}/secrets/nextcloud-admin-password.txt"}
volumes:
  nextcloud-code:
networks:
  default: {}
  nextcloud-internal:
    internal: true
